<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Programa de Formação Continuada
</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>

<body>

<header class="header">

  <div class="header-container">

    <div class="logo-area">

      <img
        src="logo-programa.png"
        alt="Programa de Formação Continuada"
        class="logo"
      >

      <div class="titulos">

        <h1>
          Programa de Formação Continuada
        </h1>

        <h2>
          Rede Municipal de Ensino
        </h2>

        <p>
          Tangará da Serra - MT
        </p>

      </div>

    </div>

    <div
      id="usuarioArea"
      class="usuario-card"
    >

      <div class="usuario-email">
        Não conectado
      </div>

      <div class="usuario-perfil">
        Visitante
      </div>

    </div>

  </div>

</header>

<main class="main">
<div class="marca-esquerda"></div>

<div class="marca-direita"></div>
  <!-- LOGIN -->

  <div
    id="loginContainer"
    class="login-container"
  >

    <div class="login-card">

      <img
        src="logo-programa.png"
        alt="Logo"
      >

      <h2>
        Acesso ao Sistema
      </h2>

      <input

        type="email"

        id="email"

        placeholder="Digite seu e-mail institucional"

      >

      <br><br>

      <button

        class="btn btn-azul"

        onclick="entrar()"

      >

        Entrar

      </button>

    </div>

  </div>

  <!-- MENU -->

  <div

    id="menu"

    class="menu-grid"

    style="display:none"

  >

    <!-- MEU PERFIL -->

  <div class="menu-card"
onclick="location.href='perfil.html'">

  <img
    src="icone-meu-perfil.png"
    class="icone-menu"
  >

</div>

    <!-- ESCOLA -->

<div class="menu-card"
onclick="location.href='escola.html'">

  <img
    src="icone-escola.png"
    class="icone-menu"
  >

</div>

    <!-- EVENTOS -->

<div class="menu-card"
onclick="location.href='eventos.html'">

  <img
    src="icone-eventos.png"
    class="icone-menu"
  >

</div>

    <!-- ADMIN -->

<div class="menu-card"
onclick="location.href='admin.html'">

  <img
    src="icone-administracao.png"
    class="icone-menu"
  >

</div>

    <!-- COORDENADOR -->

<div class="menu-card"
onclick="location.href='coordenador.html'">

  <img
    src="icone-coordenador.png"
    class="icone-menu"
  >

</div>

    <!-- VALIDAÇÃO -->

<div class="menu-card"
onclick="location.href='validar.html'">

  <img
    src="icone-validacao.png"
    class="icone-menu"
  >

</div>

  </div>

</main>

<footer class="footer">

  <img
    src="cropped-brasao.png"
    alt="Brasão"
  >

  <div>

    Secretaria Municipal de Educação

    <br>

    Tangará da Serra - MT

    <br><br>

    Programa de Formação Continuada

    <br>

    Versão 1.0

  </div>

</footer>

<script src="index.js"></script>

</body>

</html>
