<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Programa de Formação Continuada
</title>

<link
  rel="stylesheet"
  href="style.css"
>

</head>

<body>

<header class="header">

  <div class="header-esquerda">

    <img
      src="logo-programa.png"
      class="logo-principal"
    >

    <div class="titulo-principal">

      <div class="linha-superior">

        PROGRAMA DE

      </div>

      <div class="linha-central">

        FORMAÇÃO CONTINUADA

      </div>

      <div class="linha-inferior">

        DA REDE MUNICIPAL DE ENSINO

      </div>

      <div class="cidade">

        TANGARÁ DA SERRA - MT

      </div>

    </div>

  </div>

  <div
    id="usuarioArea"
    class="usuario-header"
  >

    Não conectado

  </div>

</header>
<main class="main">
<div class="marca-esquerda"></div>

<div class="marca-direita"></div>
  <!-- LOGIN -->

  <div
    id="loginContainer"
    class="login-container"
  >

    <div class="login-card">

      <img
        src="logo-programa.png"
        alt="Logo"
      >

      <h2>
        Acesso ao Sistema
      </h2>

      <input

        type="email"

        id="email"

        placeholder="Digite seu e-mail institucional"

      >

      <br><br>

      <button

        class="btn btn-azul"

        onclick="entrar()"

      >

        Entrar

      </button>

    </div>

  </div>

  <!-- MENU -->

  <div

    id="menu"

    class="menu-grid"

    style="display:none"

  >

    <!-- MEU PERFIL -->

  <div class="menu-card"
onclick="location.href='perfil.html'">

  <img
    src="icone-meu-perfil.png"
    class="icone-menu"
  >

</div>

    <!-- ESCOLA -->

<div class="menu-card"
onclick="location.href='escola.html'">

  <img
    src="icone-escola.png"
    class="icone-menu"
  >

</div>

    <!-- EVENTOS -->

<div class="menu-card"
onclick="location.href='eventos.html'">

  <img
    src="icone-eventos.png"
    class="icone-menu"
  >

</div>

    <!-- ADMIN -->

<div class="menu-card"
onclick="location.href='admin.html'">

  <img
    src="icone-administracao.png"
    class="icone-menu"
  >

</div>

    <!-- COORDENADOR -->

<div class="menu-card"
onclick="location.href='coordenador.html'">

  <img
    src="icone-coordenador.png"
    class="icone-menu"
  >

</div>

    <!-- VALIDAÇÃO -->

<div class="menu-card"
onclick="location.href='validar.html'">

  <img
    src="icone-validacao.png"
    class="icone-menu"
  >

</div>

  </div>

</main>

<footer class="footer">

  <div class="footer-coluna">

    <div class="footer-institucional">

      <img
        src="cropped-brasao.png"
        class="brasao-footer"
      >

      <div>

        <div class="footer-secretaria">

          Secretaria Municipal de Educação

        </div>

        <div class="footer-cidade">

          Tangará da Serra - MT

        </div>

      </div>

    </div>

  </div>

  <div class="footer-coluna">

    <div class="footer-programa">

       ,,︵୨ Programa de Formação Continuada ୧︵,,

    </div>

    <div class="footer-versao">

      Versão 1.0

    </div>

  </div>

  <div class="footer-coluna">

    <div class="footer-slogan">

     ⋆⭒˚Formação que transformar˚⭒⋆

    </div>

    <div class="footer-frase">

     ・┆✦ Educação que inspira! ✦┆・

    </div>

  </div>

</footer>

<script src="index.js"></script>

</body>

</html>
